services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment: &laravel_environment
      APP_NAME: ${APP_NAME:-SKARP IoT Dashboard}
      APP_ENV: ${APP_ENV:-production}
      APP_KEY: ${APP_KEY}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_URL: ${APP_URL}
      APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Jakarta}
      LOG_CHANNEL: ${LOG_CHANNEL:-stderr}
      LOG_LEVEL: ${LOG_LEVEL:-warning}
      CACHE_STORE: ${CACHE_STORE:-file}
      SESSION_DRIVER: ${SESSION_DRIVER:-file}
      QUEUE_CONNECTION: ${QUEUE_CONNECTION:-sync}
      FIREBASE_API_KEY: ${FIREBASE_API_KEY}
      FIREBASE_AUTH_DOMAIN: ${FIREBASE_AUTH_DOMAIN}
      FIREBASE_DATABASE_URL: ${FIREBASE_DATABASE_URL}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID}
      FIREBASE_STORAGE_BUCKET: ${FIREBASE_STORAGE_BUCKET}
      FIREBASE_MESSAGING_SENDER_ID: ${FIREBASE_MESSAGING_SENDER_ID}
      FIREBASE_APP_ID: ${FIREBASE_APP_ID}
      FIREBASE_CREDENTIALS: ${FIREBASE_CREDENTIALS:-/var/www/html/storage/app/firebase-credentials.json}
      FIREBASE_CREDENTIALS_BASE64: ${FIREBASE_CREDENTIALS_BASE64}
      FONNTE_TOKEN: ${FONNTE_TOKEN}
      WA_TARGET_NUMBER: ${WA_TARGET_NUMBER}
      ALERT_AMONIA_THRESHOLD: ${ALERT_AMONIA_THRESHOLD:-25}
      ALERT_THI_THRESHOLD: ${ALERT_THI_THRESHOLD:-83}
      ALERT_EXTREME_AMONIA_THRESHOLD: ${ALERT_EXTREME_AMONIA_THRESHOLD:-50}
      ALERT_EXTREME_THI_THRESHOLD: ${ALERT_EXTREME_THI_THRESHOLD:-85}
      ALERT_COOLDOWN_MINUTES: ${ALERT_COOLDOWN_MINUTES:-360}
      HISTORY_MAX_AMONIA_PPM: ${HISTORY_MAX_AMONIA_PPM:-50}
      RECAP_SECRET: ${RECAP_SECRET}
    volumes:
      - laravel_storage:/var/www/html/storage

  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    expose:
      - "80"
    volumes:
      - ./:/var/www/html:ro
      - laravel_storage:/var/www/html/storage
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      <<: *laravel_environment
      CONTAINER_ROLE: scheduler
    volumes:
      - laravel_storage:/var/www/html/storage
    command: php artisan schedule:work

  queue:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      <<: *laravel_environment
      CONTAINER_ROLE: queue
    volumes:
      - laravel_storage:/var/www/html/storage
    command: php artisan queue:work --sleep=3 --tries=3 --max-time=3600

volumes:
  laravel_storage:
